services:
  mysql:
    image: mysql:8.4
    container_name: ewallet-recon-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ewallet
      MYSQL_DATABASE: ewallet_recon
      MYSQL_USER: ewallet
      MYSQL_PASSWORD: ewallet
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uewallet", "-pewallet"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ewallet-recon-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://ewallet:ewallet@mysql:3306/ewallet_recon
      JWT_SECRET: change-me-in-production-use-long-secret
      PORT: 3001
      NODE_ENV: production
      MATCH_TIME_WINDOW_MINUTES: 15
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"

volumes:
  mysql_data:
